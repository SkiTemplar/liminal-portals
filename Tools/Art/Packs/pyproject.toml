[project]
name = "liminal-packs"
version = "0.1.0"
description = "Packs CC0 de vegetación y rocas (Quaternius, Kenney): manifiesto, descarga reproducible con sha256 y normalización en Blender."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.coverage.run]
source = ["."]
# Los scripts de Blender (bpy) se validan ejecutándolos: check_export.py y las hojas.
omit = ["tests/*", "normalize.py", "check_export.py", "contact_sheet.py", "inventory.py", "bl_mesh.py", "bl_sheet.py"]
